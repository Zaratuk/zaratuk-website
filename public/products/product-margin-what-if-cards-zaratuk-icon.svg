    <path d="M97 200c28-7 51-18 72-38 9 3 21 2 34-6" fill="none" stroke="url(#margin-green)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M197 147l15-4-4 15" fill="none" stroke="#0f6655" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="95" cy="200" r="8" fill="#0d8a72"/>

