<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">Product Margin What-If Cards icon</title>
  <desc id="desc">A Zaratuk branded product margin scenario icon with a product box, margin chart, and what-if slider.</desc>
  <defs>
    <linearGradient id="margin-bg" x1="38" x2="262" y1="36" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffefa"/>
      <stop offset="1" stop-color="#f8f6ee"/>
    </linearGradient>
    <linearGradient id="margin-green" x1="92" x2="212" y1="76" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d715f"/>
      <stop offset="1" stop-color="#174334"/>
    </linearGradient>
    <linearGradient id="margin-sage" x1="98" x2="214" y1="164" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cfeadd"/>
      <stop offset="1" stop-color="#35a98f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#174334" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect x="9" y="9" width="282" height="282" rx="48" fill="url(#margin-bg)" stroke="#e1e4d9" stroke-width="3"/>
  <circle cx="150" cy="116" r="58" fill="#eaf3ed"/>

