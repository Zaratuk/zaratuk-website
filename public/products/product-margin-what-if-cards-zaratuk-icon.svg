    <rect x="168" y="179" width="13" height="45" rx="3" fill="#4db49a"/>
    <rect x="193" y="167" width="13" height="57" rx="3" fill="#0d8a72"/>

    <rect x="86" y="228" width="128" height="8" rx="4" fill="#c9dacc"/>
    <rect x="86" y="228" width="68" height="8" rx="4" fill="url(#margin-green)"/>
    <circle cx="154" cy="232" r="17" fill="#ffffff"/>
    <circle cx="154" cy="232" r="12" fill="#f2c811"/>
