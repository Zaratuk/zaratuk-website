    <path d="M128 78l45 25-13 8-45-26 13-7z" fill="#fffefa"/>
    <path d="M128 78l45 25v20l-12 7v-19l-45-26 12-7z" fill="#e7f0ea"/>
    <rect x="169" y="132" width="23" height="12" rx="3" fill="#f8f6ee"/>
  </g>

  <g filter="url(#soft-shadow)">
